name: docker-mcp

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MCP image
        run: docker compose -f mcp/docker-compose.yml build

      - name: Smoke test tools/list
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}\n' \
            | docker run --rm -i local-toolkit/site-ops-mcp:latest python3 /workspace/mcp/site_ops_mcp_server.py \
            | tee /tmp/mcp.out
          grep -q '"site_probe"' /tmp/mcp.out
